name: Production readiness
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install '.[api,dev]' build
      - run: ruff check .
      - run: python -m pytest tests -q
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Verify the installed wheel outside the source checkout
        run: |
          cd "${{ runner.temp }}"
          python -c 'import api; from risk_scorer import OTRiskScorer; assert api.app'
          ics-scanner --help
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
  container:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify container liveness and API authentication
        run: |
          set -euo pipefail
          docker build -t scanner:ci .
          docker run -d --name scanner-ci -p 127.0.0.1:8000:8000 -e SCANNER_API_KEY=ci-only scanner:ci
          trap 'docker logs scanner-ci; docker rm -f scanner-ci' EXIT
          curl --fail --retry 20 --retry-connrefused --retry-delay 2 http://127.0.0.1:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/scan)" = 401
          test "$(docker exec scanner-ci id -u)" = 10001
