name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    # The suite is fully offline: NVD and CISA KEV responses come from recorded
    # fixtures and the tests fail on any real network connection. Blank keys make
    # sure nothing can pick up credentials from the environment.
    env:
      NVD_API_KEY: ""
      AZURE_OPENAI_ENDPOINT: ""
      AZURE_OPENAI_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v --tb=short --junitxml=test-results.xml

      - name: Validate sample inventory and SBOM (offline CLI smoke test)
        run: |
          python main.py -i sample_inventory.csv --validate
          python main.py -i sample_sbom_cyclonedx.json --validate

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff==0.16.10"

      - name: Lint
        run: ruff check --output-format=github .

  docker:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ics-scanner:ci .

      - name: Smoke-test the image
        run: |
          docker run --rm ics-scanner:ci python main.py -i sample_inventory.csv --validate
          docker run --rm ics-scanner:ci python main.py -i sample_sbom_cyclonedx.json --validate
          docker run --rm ics-scanner:ci python -c "import api; print(api.app.title)"
